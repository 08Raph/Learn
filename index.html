<style>
:root {

}

  --bg: #0d1224; --surface: #161c35; --surface2: #1b2240; --text: #e8ecf9; --muted: #9aa4c8; --border: #2a3358;
  --accent: #8fa3ff; --accent-ink: #0d1224; --mark: #ffd84d; --good: #5fd6a4; --good-bg: #12392e; --bad: #ff8f86; --bad-bg: #44201f;

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }

.learn h2 { font-size: 28px; line-height: 1.15; font-weight: 800; margin-bottom: 10px; }
.learn .body p { margin: 0 0 12px; max-width: 64ch; }
.codeblock { font-family: var(--mono); font-size: 14px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; tab-size: 4; }
.exwrap { margin: 4px 0 14px; }

.work h3 { font-size: 17px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.work .task { margin: 0 0 12px; }
.editor { position: relative; border: 1.5px solid var(--border); border-radius: 12px; background-color: var(--code-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 22px; background-position: 0 12px; overflow: hidden; }
.editor:focus-within { border-color: var(--accent); }

.out { margin-top: 12px; border-radius: 12px; background: var(--out-bg); color: var(--out-text); font-family: var(--mono); font-size: 14px; padding: 10px 14px; min-height: 60px; max-height: 300px; overflow: auto; }

.out pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }

.out .dim { color: #8d98c4; margin-top: 6px; }

@media (prefers-reduced-motion: reduce) { .bar > div, .lcard { transition: none; } }

/* ===== v3 additions ===== */
:root { --beg: #0f7350; --mid: #2437d6; --prc: #c2410c; --code-size: 15px; --lh: calc(var(--code-size) * 1.5); }

:root[data-theme="dark"] { --beg: #5fd6a4; --mid: #8fa3ff; --prc: #ffb86b; }
.t-beginner { --tc: var(--beg); } .t-intermediate { --tc: var(--mid); } .t-pro { --tc: var(--prc); }

.cards { margin: 0 0 4px; }

.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.chcard{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;min-height:44px}.chcard:hover{border-color:var(--accent)}.chcard span{font-size:14px;color:var(--muted)}.chcard small{margin-top:auto;font-size:13px;color:var(--muted)}.chok{color:var(--good);font-weight:700}
.chex{padding-left:20px;line-height:1.8}.chsum{font-weight:800;font-size:18px;margin:12px 0 6px}.chsum.ok{color:var(--good)}.chsum.no{color:var(--bad)}.chtests{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}.chtests li{padding:6px 10px;border-radius:10px;background:var(--surface2)}.chtests li.no{border-left:4px solid var(--bad)}.chtests li.ok{border-left:4px solid var(--good)}
.hmwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.hmdays{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;color:var(--muted);line-height:14px}.hmgrid{display:flex;gap:3px}.hmcol{display:grid;grid-template-rows:repeat(7,14px);gap:3px}
.hm{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);box-sizing:border-box}.hm.f{visibility:hidden}.hm.l1{background:color-mix(in srgb,var(--good) 30%,var(--surface2))}.hm.l2{background:color-mix(in srgb,var(--good) 55%,var(--surface2))}.hm.l3{background:color-mix(in srgb,var(--good) 80%,var(--surface2))}.hm.l4{background:var(--good)}
.hmkey{white-space:nowrap;margin-left:8px}.hmkey .hm{width:11px;height:11px;vertical-align:middle;margin:0 1px}
.wkbars{width:100%;height:auto;max-width:640px;display:block}.wkbars rect{fill:var(--accent)}.wkbars text{font-size:12px;fill:var(--text);font-weight:700}.wkbars text.ax{font-weight:500;fill:var(--muted)}
.installtip{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.coursenav{margin-top:14px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}.coursenav a{color:var(--muted);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
