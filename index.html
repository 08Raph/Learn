<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn to Code: Python, JavaScript, C and C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f9; --surface: #ffffff; --surface2: #f6f8fd; --text: #141a33; --muted: #5a6385; --border: #d5dcec;
  --accent: #2437d6; --accent-ink: #ffffff; --mark: #ffe14d; --good: #0f7a55; --good-bg: #dff4ea; --bad: #b8302a; --bad-bg: #fbe4e1;
  --code-bg: #f7f9fe; --grid: rgba(36,55,214,.06); --out-bg: #0f1426; --out-text: #dfe6ff;
  --t-kw: #a626a4; --t-str: #0b7d4b; --t-num: #b25b00; --t-com: #7b839f; --t-fn: #1d4ed8; --t-pp: #9a3412;
  --head: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1224; --surface: #161c35; --surface2: #1b2240; --text: #e8ecf9; --muted: #9aa4c8; --border: #2a3358;
    --accent: #8fa3ff; --accent-ink: #0d1224; --mark: #ffd84d; --good: #5fd6a4; --good-bg: #12392e; --bad: #ff8f86; --bad-bg: #44201f;
    --code-bg: #101530; --grid: rgba(143,163,255,.07); --out-bg: #080c1b; --out-text: #dfe6ff;
    --t-kw: #d7a0ff; --t-str: #8ee0b0; --t-num: #ffb86b; --t-com: #7f89ad; --t-fn: #8fb4ff; --t-pp: #ffa77a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1224; --surface: #161c35; --surface2: #1b2240; --text: #e8ecf9; --muted: #9aa4c8; --border: #2a3358;
  --accent: #8fa3ff; --accent-ink: #0d1224; --mark: #ffd84d; --good: #5fd6a4; --good-bg: #12392e; --bad: #ff8f86; --bad-bg: #44201f;
  --code-bg: #101530; --grid: rgba(143,163,255,.07); --out-bg: #080c1b; --out-text: #dfe6ff;
  --t-kw: #d7a0ff; --t-str: #8ee0b0; --t-num: #ffb86b; --t-com: #7f89ad; --t-fn: #8fb4ff; --t-pp: #ffa77a; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 14px 16px 56px; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -.01em; margin: 0; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.top .grow { flex: 1; }
.btn { font-family: var(--head); font-weight: 700; font-size: 16px; border-radius: 12px; padding: 0 16px; min-height: 44px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .sym:focus-visible, textarea:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px; color: #fff; font-family: var(--head); font-weight: 800; font-size: 15px; }
.crumb { display: flex; align-items: center; gap: 10px; font-family: var(--head); font-weight: 800; font-size: 20px; }
.pill { font-size: 13px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
/* home */
.hero { padding: 18px 0 8px; }
.hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.05; font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--mark) 62%); padding: 0 4px; color: var(--text); }
.hero p { color: var(--muted); max-width: 60ch; margin: 10px 0 0; font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 22px 0; }
.lcard { text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform .15s ease, border-color .15s; min-height: 210px; }
.lcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.lcard h3 { font-size: 24px; font-weight: 800; }
.lcard p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
.lcard .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.foot { margin-top: 28px; color: var(--muted); font-size: 14px; }
/* lesson */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 8px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--head); font-weight: 700; font-size: 16px; cursor: pointer; touch-action: manipulation; }
.chip.done { border-color: var(--good); color: var(--good); }
.chip.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 980px) { .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } .work { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.concept { display: inline-block; background: var(--mark); color: #141a33; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
.learn h2 { font-size: 28px; line-height: 1.15; font-weight: 800; margin-bottom: 10px; }
.learn .body p { margin: 0 0 12px; max-width: 64ch; }
.codeblock { font-family: var(--mono); font-size: 14px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; tab-size: 4; }
.exwrap { margin: 4px 0 14px; }
.exlabel { font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.exout { margin-top: 8px; }
.work h3 { font-size: 17px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.work .task { margin: 0 0 12px; }
.editor { position: relative; border: 1.5px solid var(--border); border-radius: 12px; background-color: var(--code-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 22px; background-position: 0 12px; overflow: hidden; }
.editor:focus-within { border-color: var(--accent); }
.editor pre, .editor textarea { margin: 0; border: 0; padding: 12px 14px; font-family: var(--mono); font-size: 15px; line-height: 22px; letter-spacing: 0; tab-size: 4; white-space: pre; word-wrap: normal; overflow-wrap: normal; }
.editor pre { position: absolute; left: 0; top: 0; pointer-events: none; color: var(--text); will-change: transform; }
.editor pre code { font: inherit; background: none; border: 0; padding: 0; }
.editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--text); outline: none; overflow: auto; -webkit-text-fill-color: transparent; }
.editor textarea::selection { background: rgba(36,55,214,.28); -webkit-text-fill-color: transparent; }
.syms { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.sym { flex: 0 0 auto; min-width: 42px; height: 40px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface2); font-family: var(--mono); font-size: 17px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btns .primary { flex: 1 1 180px; }
.kbd { font-family: var(--mono); font-size: 12px; opacity: .8; margin-left: 6px; font-weight: 500; }
details.stdin { margin-top: 10px; font-size: 14px; color: var(--muted); }
details.stdin summary { cursor: pointer; padding: 6px 0; font-weight: 600; }
details.stdin textarea { width: 100%; min-height: 64px; font-family: var(--mono); font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--code-bg); color: var(--text); }
.out { margin-top: 12px; border-radius: 12px; background: var(--out-bg); color: var(--out-text); font-family: var(--mono); font-size: 14px; padding: 10px 14px; min-height: 60px; max-height: 300px; overflow: auto; }
.out .lab { color: #8d98c4; font-size: 12px; margin-bottom: 4px; font-family: var(--head); font-weight: 700; letter-spacing: .02em; }
.out pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.out .err { color: #ff9b93; margin-top: 6px; white-space: pre-wrap; }
.out .dim { color: #8d98c4; margin-top: 6px; }
.verdict { margin-top: 12px; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.verdict.ok { background: var(--good-bg); color: var(--good); }
.verdict.no { background: var(--bad-bg); color: var(--bad); }
.verdict strong { font-family: var(--head); font-size: 17px; display: block; margin-bottom: 2px; }
.verdict pre { margin: 6px 0 0; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: rgba(0,0,0,.08); padding: 6px 8px; border-radius: 8px; color: inherit; }
.reveal { margin-top: 12px; border: 1px dashed var(--border); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
.quiz { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 14px; }
.quiz h3 { font-size: 17px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; touch-action: manipulation; }
.opt.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.why { margin-top: 10px; font-size: 15px; }
.tok-kw { color: var(--t-kw); font-weight: 600; } .tok-str { color: var(--t-str); } .tok-num { color: var(--t-num); } .tok-com { color: var(--t-com); font-style: italic; } .tok-fn { color: var(--t-fn); } .tok-pp { color: var(--t-pp); }
.seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 42px; padding: 0 14px; font-family: var(--head); font-weight: 700; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.playgrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .playgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.warn { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > div, .lcard { transition: none; } }

/* ===== v3 additions ===== */
:root { --beg: #12805c; --mid: #2437d6; --prc: #c2410c; --code-size: 15px; --lh: calc(var(--code-size) * 1.5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --beg: #5fd6a4; --mid: #8fa3ff; --prc: #ffb86b; } }
:root[data-theme="dark"] { --beg: #5fd6a4; --mid: #8fa3ff; --prc: #ffb86b; }
.t-beginner { --tc: var(--beg); } .t-intermediate { --tc: var(--mid); } .t-pro { --tc: var(--prc); }
.xpchip { font-family: var(--head); font-weight: 700; font-size: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 99px; padding: 7px 12px; white-space: nowrap; }
.badge.big { min-width: 46px; height: 46px; font-size: 18px; border-radius: 13px; }
/* home */
.homegrid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: stretch; margin-top: 6px; }
@media (min-width: 900px) { .homegrid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.hero { padding: 10px 0; }
.continue { margin-top: 18px; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 520px; text-align: left; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px; padding: 12px 16px; cursor: pointer; min-height: 64px; touch-action: manipulation; }
.continue .ct { display: flex; flex-direction: column; flex: 1; line-height: 1.25; } .continue small { opacity: .8; font-weight: 600; font-size: 12px; } .continue b { font-family: var(--head); font-size: 17px; } .continue .go { font-size: 22px; font-weight: 800; }
.statcard { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.rankrow { display: flex; justify-content: space-between; align-items: flex-end; } .rankrow small { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .08em; }
.rank { font-family: var(--head); font-weight: 800; font-size: 32px; line-height: 1.1; }
.streak { text-align: center; font-size: 22px; line-height: 1; } .streak b { font-family: var(--head); font-size: 28px; } .streak small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.xpline { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: -4px; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; } .mini div { background: var(--surface2); border-radius: 12px; padding: 8px 10px; } .mini b { font-family: var(--head); font-size: 22px; display: block; line-height: 1.1; } .mini small { color: var(--muted); font-size: 12px; font-weight: 600; }
.path { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 22px 0 4px; }
.path .step { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 8px 14px 8px 8px; flex: 1 1 220px; }
.path .num { width: 34px; height: 34px; border-radius: 10px; background: var(--tc); color: var(--bg); display: grid; place-items: center; font-family: var(--head); font-weight: 800; flex: 0 0 auto; }
.path b { font-family: var(--head); display: block; line-height: 1.2; color: var(--tc); } .path small { color: var(--muted); font-size: 13px; line-height: 1.3; display: block; } .path .arrow { color: var(--muted); font-weight: 800; }
@media (max-width: 760px) { .path .arrow { display: none; } }
.sect { font-size: 22px; font-weight: 800; margin: 26px 0 12px; }
.cards { margin: 0 0 4px; }
.tiers3 { display: grid; gap: 5px; margin-top: 2px; } .t3 { display: grid; grid-template-columns: 34px 1fr 38px; align-items: center; gap: 8px; }
.t3l { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--tc); } .t3n { font-size: 12px; color: var(--muted); font-weight: 700; text-align: right; }
.bar.sm { height: 6px; } .bar .f-beginner { background: var(--beg); } .bar .f-intermediate { background: var(--mid); } .bar .f-pro { background: var(--prc); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.ach { background: var(--surface); border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; opacity: .55; filter: grayscale(1); }
.ach.on { opacity: 1; filter: none; border-style: solid; border-color: var(--mark); background: linear-gradient(180deg, var(--surface), var(--surface2)); }
.ach .ic { font-size: 26px; line-height: 1.1; } .ach b { font-family: var(--head); } .ach small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
/* lesson nav */
.ttabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.ttab { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 46px; padding: 6px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; border-bottom: 4px solid var(--tc); touch-action: manipulation; text-align: left; }
.ttab b { font-family: var(--head); font-size: 15px; } .ttab small { font-weight: 700; color: var(--muted); }
.ttab.on { background: var(--tc); border-color: var(--tc); color: var(--bg); } .ttab.on small { color: var(--bg); opacity: .85; }
@media (max-width: 520px) { .ttab { flex-direction: column; align-items: flex-start; gap: 0; } .ttab b { font-size: 13px; } }
.lchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 8px; scrollbar-width: thin; }
.lchip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; max-width: 220px; min-height: 44px; padding: 4px 14px 4px 6px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; touch-action: manipulation; text-align: left; }
.lchip .n { width: 32px; height: 32px; border-radius: 9px; background: var(--surface2); display: grid; place-items: center; font-family: var(--head); font-weight: 800; flex: 0 0 auto; }
.lchip .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lchip.done .n { background: var(--good-bg); color: var(--good); } .lchip.done { border-color: var(--good); }
.lchip.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; } .lchip.current .n { background: var(--accent); color: var(--accent-ink); }
.lchip:focus-visible, .ttab:focus-visible, .drow:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.lhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; } .lhead .concept { margin: 0; } .lhead .pill { margin-left: auto; }
.tier { font-family: var(--head); font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; background: var(--tc); color: var(--bg); padding: 3px 9px; border-radius: 99px; }
/* editor upgrades */
.edbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; } .fname { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 600; } .grow { flex: 1; }
.sym.sm { min-width: 38px; height: 32px; font-size: 13px; font-family: var(--head); font-weight: 800; }
.editor pre, .editor textarea { font-size: var(--code-size); line-height: var(--lh); padding: 12px 14px 12px 60px; }
.editor { background-size: 100% var(--lh); background-position: 0 12px; }
.gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; background: var(--surface2); border-right: 1px solid var(--border); overflow: hidden; pointer-events: none; }
.gnum { padding: 12px 8px 12px 0; text-align: right; font-family: var(--mono); font-size: var(--code-size); line-height: var(--lh); color: var(--t-com); white-space: pre; will-change: transform; user-select: none; }
.editor pre code { font-size: var(--code-size); }
/* drawer */
.drawerwrap { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(8,12,27,.5); }
.drawer { position: relative; width: min(420px, 92vw); height: 100%; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: slidein .2s ease; }
@keyframes slidein { from { transform: translateX(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); font-family: var(--head); font-size: 17px; } .dhead b { display: flex; align-items: center; gap: 10px; }
.dbody { overflow: auto; padding: 8px 12px 24px; }
.dt { font-family: var(--head); font-weight: 800; color: var(--tc); margin: 14px 4px 6px; text-transform: uppercase; font-size: 13px; letter-spacing: .06em; } .dt small { color: var(--muted); }

  try { new Function('return 1')(); } catch (e) { canEval = false; }
  const quote = (s) => "'" + s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'";
  function inspect(v, nested, seen) {
    if (typeof v === 'string') return nested ? quote(v) : v;
    if (v === null) return 'null'; if (v === undefined) return 'undefined';
    if (typeof v === 'function') return '[Function' + (v.name ? ': ' + v.name : ' (anonymous)') + ']';
    if (typeof v === 'bigint') return v + 'n'; if (typeof v === 'symbol') return String(v);
    if (typeof v === 'number') return Object.is(v, -0) ? '-0' : String(v);
    if (typeof v !== 'object') return String(v);
    seen = seen || [];
    if (seen.includes(v)) return '[Circular]';
    seen = seen.concat([v]);
    if (Array.isArray(v)) return '[' + v.map((x) => inspect(x, true, seen)).join(', ') + ']';
    if (v instanceof Error) return v.name + ': ' + v.message;
    if (v instanceof Map) return 'Map(' + v.size + ') {' + [...v].map(([k, x]) => ' ' + inspect(k, true, seen) + ' => ' + inspect(x, true, seen)).join(',') + ' }';
    if (v instanceof Set) return 'Set(' + v.size + ') {' + [...v].map((x) => ' ' + inspect(x, true, seen)).join(',') + ' }';
    const keys = Object.keys(v);
    if (!keys.length) return '{}';
    return '{ ' + keys.map((k) => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : quote(k)) + ': ' + inspect(v[k], true, seen)).join(', ') + ' }';
  }
  function guard(code) {
    return code
      .replace(/\b(for|while)\s*\(((?:[^()]|\((?:[^()]|\([^()]*\))*\))*)\)\s*\{/g, '$1 ($2) { __t();')
      .replace(/\bdo\s*\{/g, 'do { __t();');
  }
  function exec(code, expr) {
    const lines = []; let ticks = 0;
    const log = (...a) => { lines.push(a.map((x) => inspect(x, false)).join(' ')); if (lines.length > 5000) throw new Error('Too much output'); };
    const con = { log, info: log, warn: log, error: log, table: log };
    const tick = () => { if (++ticks > 3000000) throw new Error('Your program ran for too long. It may contain an infinite loop.'); };
    if (!canEval) return { ok: false, lines, error: 'This browser blocks running JavaScript from the editor (eval is disabled), so JavaScript lessons cannot run here. Python, C and C++ still work.' };
    try {
      const src = guard(code) + (expr ? '\n;return (' + expr + ');' : '');
      const val = new Function('console', '__t', src)(con, tick);
      return { ok: true, lines, val };
    } catch (e) { return { ok: false, lines, error: (e && e.name ? e.name : 'Error') + ': ' + (e && e.message ? e.message : String(e)) }; }
  }
  function plain(v) {
    if (v === undefined) return undefined;
    try { return JSON.parse(JSON.stringify(v, (k, x) => (typeof x === 'number' && !Number.isFinite(x) ? String(x) : x))); } catch (e) { return String(v); }
  }
  function run(code) { const r = exec(code); return { out: r.lines.length ? r.lines.join('\n') + '\n' : '', error: r.ok ? null : r.error }; }
  function session(code) {
    const base = exec(code);
    return {
      out: base.lines.length ? base.lines.join('\n') + '\n' : '', error: base.ok ? null : base.error,
      evalExpr(expr) { const r = exec(code, expr); return r.ok ? { ok: true, value: plain(r.val) } : { ok: false, error: r.error }; },
    };
  }
  return { run, session, canEval };
})();

  { tier: 'intermediate', id: 'closures', title: 'Closures', concept: 'functions that remember',
    body: '<p>A <b>closure</b> is a function that remembers the variables around it, even after the outer function has finished. That lets you keep private state without classes.</p><p>Arrow functions make this compact: <code>const add = a =&gt; b =&gt; a + b</code> is a function that returns a function.</p>',
    example: 'function makeTimes(k) {\n  return x => x * k;\n}\nconst triple = makeTimes(3);\nconsole.log(triple(5));',
    task: 'Write <code>makeCounter()</code> that returns a function. Each time you call the returned function it adds 1 to a private count and returns the new count.',

  { tier: 'intermediate', id: 'strmethods', title: 'Text tools', concept: 'split, join, slice',
    body: '<p>Strings come with many helpers: <code>split(sep)</code> cuts text into an array, <code>join(sep)</code> glues an array back together, <code>slice(a, b)</code> copies a part, <code>trim()</code>, <code>replace</code>, <code>includes</code>, <code>startsWith</code>, <code>toUpperCase</code>.</p><p>They chain nicely: <code>"a-b-c".split("-").reverse().join("+")</code>.</p>',
    example: 'const s = "  hello big world ";\nconst words = s.trim().split(" ");\nconsole.log(words);\nconsole.log(words.join("-"));\nconsole.log(words[0][0].toUpperCase() + words[0].slice(1));',
    task: 'Write <code>capitalizeWords(text)</code> that capitalises the first letter of every word, like <code>"hello big world"</code> becomes <code>"Hello Big World"</code>.',
    starter: 'function capitalizeWords(text) {\n  \n}\n',

  { tier: 'intermediate', id: 'errors', title: 'Handling errors', concept: 'try / catch / throw',
    body: '<p>Code can fail: bad input, missing data. <code>try { ... } catch (e) { ... }</code> runs risky code and lets you recover instead of crashing. <code>finally</code> always runs. Use <code>throw new Error("message")</code> to signal a problem yourself.</p><p><code>JSON.parse(text)</code> turns JSON text into a value, and throws if the text is invalid. A perfect thing to wrap in try / catch.</p>',
    example: 'try {\n  JSON.parse("oops");\n} catch (e) {\n  console.log("bad JSON");\n} finally {\n  console.log("done");\n}',
    task: 'Write <code>parseJSON(text)</code> that returns the parsed value, or <code>null</code> if the text is not valid JSON.',
    starter: 'function parseJSON(text) {\n  \n}\n',
    check: { tests: [['parseJSON(\'{"a":1}\')', { a: 1 }], ['parseJSON("oops")', null], ['parseJSON("[1,2]")', [1, 2]]] },
    hint: 'try { return JSON.parse(text); } catch (e) { return null; }',
    solution: 'function parseJSON(text) {\n  try {\n    return JSON.parse(text);\n  } catch (e) {\n    return null;\n  }\n}',
    quiz: { code: 'try {\n  null.x;\n} catch (e) {\n  console.log("caught");\n} finally {\n  console.log("done");\n}', options: ['caught\ndone', 'done', 'caught'], answer: 0, why: 'Reading a property of null throws, so catch prints "caught". finally runs afterwards either way.' } },
  { tier: 'intermediate', id: 'classes', title: 'Classes', concept: 'class, constructor, this',
    body: '<p>A <b>class</b> is a blueprint for objects. The <code>constructor</code> sets up each new object, <code>this</code> refers to the object itself, and methods are functions that belong to it. Create one with <code>new</code>.</p><p>Returning <code>this</code> from a method lets you chain calls: <code>counter.inc().inc()</code>.</p>',
    example: 'class Dog {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    return this.name + " says woof";\n  }\n}\nconsole.log(new Dog("Rex").speak());',
    task: 'Finish the <code>Rectangle</code> class: <code>area()</code> returns width times height and <code>perimeter()</code> returns <code>2 * (width + height)</code>.',
    starter: 'class Rectangle {\n  constructor(width, height) {\n    this.width = width;\n    this.height = height;\n  }\n  area() {\n    // return width * height\n  }\n  perimeter() {\n    // return 2 * (width + height)\n  }\n}\n',
    check: { tests: [['r.area()', 12, 'const r = new Rectangle(3, 4);'], ['r.perimeter()', 14, 'const r = new Rectangle(3, 4);'], ['r.area()', 0, 'const r = new Rectangle(0, 9);']] },
    hint: 'Use this.width and this.height inside the methods.',
    solution: 'class Rectangle {\n  constructor(width, height) {\n    this.width = width;\n    this.height = height;\n  }\n  area() {\n    return this.width * this.height;\n  }\n  perimeter() {\n    return 2 * (this.width + this.height);\n  }\n}',
    quiz: { code: 'class Counter {\n  constructor() { this.n = 0; }\n  inc() { this.n++; return this; }\n}\nconsole.log(new Counter().inc().inc().n);', options: ['1', '2', '0'], answer: 1, why: 'Each inc() adds 1 and returns the same object, so the second call continues from the first. n ends at 2.' } },
  { tier: 'intermediate', id: 'mapset', title: 'Map and Set', concept: 'Map, Set',
    body: '<p>A <code>Set</code> stores unique values: adding a duplicate does nothing. Turn it into an array with <code>[...set]</code>. A <code>Map</code> stores key and value pairs like an object, but any value can be a key and it remembers insertion order.</p><p>Map methods: <code>set(k, v)</code>, <code>get(k)</code>, <code>has(k)</code>, <code>delete(k)</code> and <code>size</code>.</p>',
    example: 'const s = new Set([1, 2, 2, 3]);\nconsole.log(s.size, [...s]);\nconst m = new Map();\nm.set("a", 1);\nconsole.log(m.get("a"), m.has("z"));',
    task: 'Write <code>unique(arr)</code> that returns a new array with the duplicates removed, keeping the first occurrence of each value.',
    starter: 'function unique(arr) {\n  \n}\n',
    check: { tests: [['unique([1, 2, 2, 3, 1])', [1, 2, 3]], ['unique([])', []], ['unique(["a", "a"])', ['a']]] },
    hint: 'return [...new Set(arr)];',
    solution: 'function unique(arr) {\n  return [...new Set(arr)];\n}',
    quiz: { code: 'const m = new Map();\nm.set("a", 1);\nm.set("a", 5);\nconsole.log(m.get("a"), m.size);', options: ['5 1', '1 2', '5 2'], answer: 0, why: 'Setting the same key again replaces the value (5) rather than adding a second entry, so the size stays 1.' } },
  { tier: 'pro', id: 'recursion', title: 'Recursion', concept: 'a function calling itself',
    body: '<p>A <b>recursive</b> function solves a problem by calling itself on a smaller piece. It needs a <b>base case</b> that stops and a <b>recursive case</b> that gets closer to it.</p><p>Recursion is perfect for nested data such as folders inside folders. To <b>flatten</b> nested arrays, loop over the items: if an item is itself an array, flatten that first.</p>',
    example: 'function factorial(n) {\n  return n <= 1 ? 1 : n * factorial(n - 1);\n}\nconsole.log(factorial(5));\nconsole.log(Array.isArray([1]), Array.isArray(1));',
    task: 'Write <code>flatten(arr)</code> that turns a nested array into a flat one: <code>[1, [2, [3]], 4]</code> becomes <code>[1, 2, 3, 4]</code>.',
    starter: 'function flatten(arr) {\n  const out = [];\n  // for each item: if it is an array, flatten it too\n  return out;\n}\n',
    check: { tests: [['flatten([1, [2, [3]], 4])', [1, 2, 3, 4]], ['flatten([])', []], ['flatten([[[]]])', []], ['flatten([1, 2])', [1, 2]]] },
    hint: 'if (Array.isArray(item)) { out.push(...flatten(item)); } else { out.push(item); }',
    solution: 'function flatten(arr) {\n  const out = [];\n  for (const item of arr) {\n    if (Array.isArray(item)) {\n      out.push(...flatten(item));\n    } else {\n      out.push(item);\n    }\n  }\n  return out;\n}',
    quiz: { code: 'function f(n) {\n  return n <= 1 ? 1 : n * f(n - 1);\n}\nconsole.log(f(5));', options: ['25', '120', '15'], answer: 1, why: 'f(5) = 5 x 4 x 3 x 2 x 1 = 120.' } },
  { tier: 'pro', id: 'hof', title: 'Higher-order functions', concept: 'compose, map/filter/reduce',
    body: '<p>Functions are values, so functions can take other functions and return new ones. These are <b>higher-order functions</b>. <code>map</code>, <code>filter</code> and <code>reduce</code> are the famous ones, and chaining them replaces many loops.</p><p><b>Composition</b> joins two functions into one: <code>compose(f, g)(x)</code> means <code>f(g(x))</code>.</p>',
    example: 'const result = [1, 2, 3, 4]\n  .map(n => n * 2)\n  .filter(n => n > 2)\n  .reduce((a, b) => a + b, 0);\nconsole.log(result);',
    task: 'Write <code>compose(f, g)</code> that returns a new function. Calling it with <code>x</code> returns <code>f(g(x))</code>.',
    starter: 'function compose(f, g) {\n  \n}\n',
    check: { tests: [['compose(x => x + 1, x => x * 2)(5)', 11], ['compose(String, Math.abs)(-7)', '7'], ['compose(x => x, x => x)(3)', 3]] },
    hint: 'return x => f(g(x));',
    solution: 'function compose(f, g) {\n  return x => f(g(x));\n}',
    quiz: { code: 'const r = [1, 2, 3]\n  .map(n => n * 2)\n  .filter(n => n > 2)\n  .reduce((a, b) => a + b);\nconsole.log(r);', options: ['10', '12', '6'], answer: 0, why: 'map gives [2, 4, 6], filter keeps [4, 6], and reduce adds them: 10.' } },
  { tier: 'pro', id: 'search', title: 'Binary search', concept: 'O(log n)',
    body: '<p>In a <b>sorted</b> array you can find a value by repeatedly halving the search area. Look at the middle: if the target is smaller, ignore the right half; if larger, ignore the left half.</p><p>Each step halves the work, so a million items need only about 20 checks: <b>O(log n)</b> instead of O(n) for a loop. Use <code>Math.floor</code> to get a whole-number middle.</p>',
    example: 'const items = [1, 3, 5, 7, 9];\nlet lo = 0, hi = items.length - 1;\nconst mid = Math.floor((lo + hi) / 2);\nconsole.log(mid, items[mid]);',
    task: 'Write <code>binarySearch(items, target)</code> for a sorted array. Return the index of the target, or <code>-1</code> if it is not present.',
    starter: 'function binarySearch(items, target) {\n  let lo = 0, hi = items.length - 1;\n  // while lo <= hi: look at the middle and discard half\n  return -1;\n}\n',
    check: { tests: [['binarySearch([1, 3, 5, 7, 9], 7)', 3], ['binarySearch([1, 3, 5, 7, 9], 1)', 0], ['binarySearch([1, 3, 5, 7, 9], 9)', 4], ['binarySearch([1, 3, 5, 7, 9], 4)', -1], ['binarySearch([], 1)', -1]] },
    hint: 'const mid = Math.floor((lo + hi) / 2). If items[mid] === target return mid; if smaller, lo = mid + 1; else hi = mid - 1.',
    solution: 'function binarySearch(items, target) {\n  let lo = 0, hi = items.length - 1;\n  while (lo <= hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (items[mid] === target) return mid;\n    if (items[mid] < target) lo = mid + 1;\n    else hi = mid - 1;\n  }\n  return -1;\n}',
    quiz: { code: 'const items = [1, 3, 5, 7, 9];\nconst mid = Math.floor((0 + 4) / 2);\nconsole.log(mid, items[mid]);', options: ['2 5', '2 3', '4 9'], answer: 0, why: '(0 + 4) / 2 is 2 and items[2] is 5, the first probe of a binary search.' } },
  { tier: 'pro', id: 'sorting', title: 'Sorting objects', concept: 'sort with a comparator',
    body: '<p><code>sort</code> changes the array in place, so copy first with <code>[...items]</code> if you want to keep the original. Without a function it compares values as <b>text</b>, so <code>[10, 9, 1].sort()</code> gives <code>[1, 10, 9]</code>!</p><p>Pass a <b>comparator</b> <code>(a, b) =&gt; a - b</code>. A negative result puts a first, positive puts b first. To sort objects, compare one of their fields.</p>',
    example: 'console.log([10, 9, 1].sort());\nconsole.log([10, 9, 1].sort((a, b) => a - b));',
    task: 'Write <code>sortBy(items, key)</code> that returns a <b>new</b> array of objects sorted by the number stored under <code>key</code>, smallest first. Do not change the original array.',
    starter: 'function sortBy(items, key) {\n  \n}\n',
    check: { tests: [['sortBy([{n: "b", a: 3}, {n: "a", a: 1}], "a")', [{ n: 'a', a: 1 }, { n: 'b', a: 3 }]], ['sortBy([], "a")', []], ['orig.length + sortBy(orig, "v")[0].v', 4, 'const orig = [{v: 3}, {v: 1}, {v: 2}];']] },
    hint: 'return [...items].sort((x, y) => x[key] - y[key]);',

    quiz: { code: 'console.log([10, 9, 1].sort());', options: ['[1, 10, 9]', '[1, 9, 10]', '[10, 9, 1]'], answer: 0, why: 'With no comparator, sort compares as text: "1" < "10" < "9". That is why numbers need (a, b) => a - b.' } },
  { tier: 'pro', id: 'memo', title: 'Memoization', concept: 'caching results',
    body: '<p>Plain recursive Fibonacci recomputes the same values again and again and becomes hopelessly slow. <b>Memoization</b> stores each answer the first time it is computed and reuses it afterwards, turning an exponential algorithm into a linear one.</p><p>A plain object works as the cache: check <code>memo[n]</code> before computing, and store the result after.</p>',
    example: 'const cache = {};\nfunction square(n) {\n  if (cache[n] !== undefined) return cache[n];\n  cache[n] = n * n;\n  return cache[n];\n}\nconsole.log(square(9), square(9));',
    task: 'Write <code>fibMemo(n, memo = {})</code> using a cache. <code>fibMemo(10)</code> is 55 and <code>fibMemo(50)</code> must still be instant.',
    starter: 'function fibMemo(n, memo = {}) {\n  // base cases: n <= 1 returns n\n  // use memo to avoid recomputing\n}\n',
    check: { tests: [['fibMemo(10)', 55], ['fibMemo(50)', 12586269025], ['fibMemo(1)', 1], ['fibMemo(0)', 0]] },
    hint: 'if (n <= 1) return n; if (memo[n] !== undefined) return memo[n]; memo[n] = fibMemo(n - 1, memo) + fibMemo(n - 2, memo); return memo[n];',
    solution: 'function fibMemo(n, memo = {}) {\n  if (n <= 1) return n;\n  if (memo[n] !== undefined) return memo[n];\n  memo[n] = fibMemo(n - 1, memo) + fibMemo(n - 2, memo);\n  return memo[n];\n}',
    quiz: { code: 'const memo = {};\nmemo[5] = "five";\nconsole.log(memo[5], memo[6], 5 in memo);', options: ['five undefined true', 'five undefined false', 'five 6 true'], answer: 0, why: 'memo[5] was stored, memo[6] never was (undefined), and the in operator confirms key 5 exists.' } },
  { tier: 'pro', id: 'project', title: 'Project: group by', concept: 'reduce + objects',
    body: '<p>Grouping is one of the most common real-world data tasks: group orders by customer, students by class, log lines by level. The pattern: walk the items and push each into an array stored under its key.</p><p>Useful tools: <code>obj[key] = obj[key] || []</code> creates the array if it is missing, and <code>Object.keys</code> / <code>Object.entries</code> read the result back.</p>',
    example: 'const groups = {};\nfor (const word of ["apple", "avocado", "banana"]) {\n  const k = word[0];\n  groups[k] = groups[k] || [];\n  groups[k].push(word);\n}\nconsole.log(groups);\nconsole.log(Object.entries({ a: 1, b: 2 }));',
    task: 'Write <code>groupBy(items, key)</code> that returns an object whose keys are the values found under <code>key</code>, and whose values are arrays of the matching items.',
    starter: 'function groupBy(items, key) {\n  const groups = {};\n  // put each item in groups[item[key]]\n  return groups;\n}\n',
    check: { tests: [['groupBy([{t: "a", v: 1}, {t: "b", v: 2}, {t: "a", v: 3}], "t")', { a: [{ t: 'a', v: 1 }, { t: 'a', v: 3 }], b: [{ t: 'b', v: 2 }] }], ['groupBy([], "t")', {}]] },

    solution: 'function groupBy(items, key) {\n  const groups = {};\n  for (const item of items) {\n    const k = item[key];\n    groups[k] = groups[k] || [];\n    groups[k].push(item);\n  }\n  return groups;\n}',
    quiz: { code: 'console.log(Object.entries({ a: 1, b: 2 }));', options: ["[['a', 1], ['b', 2]]", "['a', 'b']", "[1, 2]"], answer: 0, why: 'Object.entries turns an object into an array of [key, value] pairs.' } },

  { tier: 'intermediate', id: 'switch', title: 'Switch statements', concept: 'switch, case, break',
    body: '<p><code>switch</code> picks one branch based on a whole-number (or char) value: cleaner than a long chain of <code>else if</code>. Each <code>case</code> is a possible value, and <code>default</code> catches everything else.</p><p>Always end a case with <code>break</code>. Without it, execution <b>falls through</b> into the next case, which is a favourite source of bugs.</p>',

    solution: R`#include <stdio.h>

void bubble_sort(int a[], int n) {

    body: '<p>In a <b>sorted</b> array you can find a value without checking everything. Look at the middle: if the target is smaller, discard the right half; if larger, discard the left half. Repeat on what is left.</p><p>Each step halves the search area, so a million items need only about 20 steps: <b>O(log n)</b>. Keep two indexes, <code>lo</code> and <code>hi</code>, and compute <code>mid = (lo + hi) / 2</code>.</p>',

    '<section class="card">' + stdinBox(lang) + outHolder + '</section></div></div>';
  bindTheme();
  $('#back').addEventListener('click', () => go({ name: 'home' }));
  $$('.seg button').forEach((b) => b.addEventListener('click', () => go({ name: 'play', lang: b.dataset.l })));
  const outEl = $('.out');
  const run = () => { const t = $('.stdinbox'); const t0 = performance.now(); const r = runCode(lang, ed.get(), t ? t.value : ''); showOut(outEl, r, lang, performance.now() - t0); };
  ed = mountEditor($('#edhost'), lang, code, run, (v) => { S.pg[lang] = v; save(); });
  $('#runBtn').addEventListener('click', run);
  $('#resetBtn').addEventListener('click', () => ed.set(PLAY_STARTERS[lang]));
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
render();
window.__app = { go, S: () => S };
})();

</script>
</body>
</html>
