<style>
:root {
  --bg: #eef2f9; --surface: #ffffff; --surface2: #f6f8fd; --text: #141a33; --muted: #5a6385; --border: #d5dcec;
  --accent: #2437d6; --accent-ink: #ffffff; --mark: #ffe14d; --good: #0f7a55; --good-bg: #dff4ea; --bad: #b8302a; --bad-bg: #fbe4e1;
  --code-bg: #f7f9fe; --grid: rgba(36,55,214,.06); --out-bg: #0f1426; --out-text: #dfe6ff;
  --t-kw: #a626a4; --t-str: #0b7d4b; --t-num: #b25b00; --t-com: #7b839f; --t-fn: #1d4ed8; --t-pp: #9a3412;
  --head: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1224; --surface: #161c35; --surface2: #1b2240; --text: #e8ecf9; --muted: #9aa4c8; --border: #2a3358;
    --accent: #8fa3ff; --accent-ink: #0d1224; --mark: #ffd84d; --good: #5fd6a4; --good-bg: #12392e; --bad: #ff8f86; --bad-bg: #44201f;
    --code-bg: #101530; --grid: rgba(143,163,255,.07); --out-bg: #080c1b; --out-text: #dfe6ff;
    --t-kw: #d7a0ff; --t-str: #8ee0b0; --t-num: #ffb86b; --t-com: #7f89ad; --t-fn: #8fb4ff; --t-pp: #ffa77a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1224; --surface: #161c35; --surface2: #1b2240; --text: #e8ecf9; --muted: #9aa4c8; --border: #2a3358;
  --accent: #8fa3ff; --accent-ink: #0d1224; --mark: #ffd84d; --good: #5fd6a4; --good-bg: #12392e; --bad: #ff8f86; --bad-bg: #44201f;
  --code-bg: #101530; --grid: rgba(143,163,255,.07); --out-bg: #080c1b; --out-text: #dfe6ff;
  --t-kw: #d7a0ff; --t-str: #8ee0b0; --t-num: #ffb86b; --t-com: #7f89ad; --t-fn: #8fb4ff; --t-pp: #ffa77a; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 14px 16px 56px; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -.01em; margin: 0; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.top .grow { flex: 1; }
.btn { font-family: var(--head); font-weight: 700; font-size: 16px; border-radius: 12px; padding: 0 16px; min-height: 44px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .sym:focus-visible, textarea:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px; color: #fff; font-family: var(--head); font-weight: 800; font-size: 15px; }
.crumb { display: flex; align-items: center; gap: 10px; font-family: var(--head); font-weight: 800; font-size: 20px; }
.pill { font-size: 13px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
/* home */
.hero { padding: 18px 0 8px; }
.hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.05; font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--mark) 62%); padding: 0 4px; color: var(--text); }
.hero p { color: var(--muted); max-width: 60ch; margin: 10px 0 0; font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 22px 0; }
.lcard { text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform .15s ease, border-color .15s; min-height: 210px; }
.lcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.lcard h3 { font-size: 24px; font-weight: 800; }
.lcard p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
.lcard .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.foot { margin-top: 28px; color: var(--muted); font-size: 14px; }
/* lesson */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 8px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--head); font-weight: 700; font-size: 16px; cursor: pointer; touch-action: manipulation; }
.chip.done { border-color: var(--good); color: var(--good); }
.chip.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 980px) { .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } .work { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.concept { display: inline-block; background: var(--mark); color: #141a33; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
.learn h2 { font-size: 28px; line-height: 1.15; font-weight: 800; margin-bottom: 10px; }
.learn .body p { margin: 0 0 12px; max-width: 64ch; }
.codeblock { font-family: var(--mono); font-size: 14px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; tab-size: 4; }
.exwrap { margin: 4px 0 14px; }
.exlabel { font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.exout { margin-top: 8px; }
.work h3 { font-size: 17px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.work .task { margin: 0 0 12px; }
.editor { position: relative; border: 1.5px solid var(--border); border-radius: 12px; background-color: var(--code-bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 22px; background-position: 0 12px; overflow: hidden; }
.editor:focus-within { border-color: var(--accent); }
.editor pre, .editor textarea { margin: 0; border: 0; padding: 12px 14px; font-family: var(--mono); font-size: 15px; line-height: 22px; letter-spacing: 0; tab-size: 4; white-space: pre; word-wrap: normal; overflow-wrap: normal; }
.editor pre { position: absolute; left: 0; top: 0; pointer-events: none; color: var(--text); will-change: transform; }
.editor pre code { font: inherit; background: none; border: 0; padding: 0; }
.editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--text); outline: none; overflow: auto; -webkit-text-fill-color: transparent; }
.editor textarea::selection { background: rgba(36,55,214,.28); -webkit-text-fill-color: transparent; }
.syms { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.sym { flex: 0 0 auto; min-width: 42px; height: 40px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface2); font-family: var(--mono); font-size: 17px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btns .primary { flex: 1 1 180px; }
.kbd { font-family: var(--mono); font-size: 12px; opacity: .8; margin-left: 6px; font-weight: 500; }
details.stdin { margin-top: 10px; font-size: 14px; color: var(--muted); }
details.stdin summary { cursor: pointer; padding: 6px 0; font-weight: 600; }
details.stdin textarea { width: 100%; min-height: 64px; font-family: var(--mono); font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--code-bg); color: var(--text); }
.out { margin-top: 12px; border-radius: 12px; background: var(--out-bg); color: var(--out-text); font-family: var(--mono); font-size: 14px; padding: 10px 14px; min-height: 60px; max-height: 300px; overflow: auto; }
.out .lab { color: #8d98c4; font-size: 12px; margin-bottom: 4px; font-family: var(--head); font-weight: 700; letter-spacing: .02em; }
.out pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.out .err { color: #ff9b93; margin-top: 6px; white-space: pre-wrap; }
.out .dim { color: #8d98c4; margin-top: 6px; }
.verdict { margin-top: 12px; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.verdict.ok { background: var(--good-bg); color: var(--good); }
.verdict.no { background: var(--bad-bg); color: var(--bad); }
.verdict strong { font-family: var(--head); font-size: 17px; display: block; margin-bottom: 2px; }
.verdict pre { margin: 6px 0 0; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: rgba(0,0,0,.08); padding: 6px 8px; border-radius: 8px; color: inherit; }
.reveal { margin-top: 12px; border: 1px dashed var(--border); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
.quiz { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 14px; }
.quiz h3 { font-size: 17px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { text-align: left; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer; font-family: var(--mono); font-size: 14px; white-space: pre-wrap; touch-action: manipulation; }
.opt.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.why { margin-top: 10px; font-size: 15px; }
.tok-kw { color: var(--t-kw); font-weight: 600; } .tok-str { color: var(--t-str); } .tok-num { color: var(--t-num); } .tok-com { color: var(--t-com); font-style: italic; } .tok-fn { color: var(--t-fn); } .tok-pp { color: var(--t-pp); }
.seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; min-height: 42px; padding: 0 14px; font-family: var(--head); font-weight: 700; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.playgrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .playgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.warn { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > div, .lcard { transition: none; } }

/* ===== v3 additions ===== */
:root { --beg: #12805c; --mid: #2437d6; --prc: #c2410c; --code-size: 15px; --lh: calc(var(--code-size) * 1.5); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --beg: #5fd6a4; --mid: #8fa3ff; --prc: #ffb86b; } }
:root[data-theme="dark"] { --beg: #5fd6a4; --mid: #8fa3ff; --prc: #ffb86b; }
.t-beginner { --tc: var(--beg); } .t-intermediate { --tc: var(--mid); } .t-pro { --tc: var(--prc); }
.xpchip { font-family: var(--head); font-weight: 700; font-size: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 99px; padding: 7px 12px; white-space: nowrap; }
.badge.big { min-width: 46px; height: 46px; font-size: 18px; border-radius: 13px; }
/* home */
.homegrid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: stretch; margin-top: 6px; }
@media (min-width: 900px) { .homegrid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.hero { padding: 10px 0; }
.continue { margin-top: 18px; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 520px; text-align: left; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 16px; padding: 12px 16px; cursor: pointer; min-height: 64px; touch-action: manipulation; }
.continue .ct { display: flex; flex-direction: column; flex: 1; line-height: 1.25; } .continue small { opacity: .8; font-weight: 600; font-size: 12px; } .continue b { font-family: var(--head); font-size: 17px; } .continue .go { font-size: 22px; font-weight: 800; }
.statcard { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.rankrow { display: flex; justify-content: space-between; align-items: flex-end; } .rankrow small { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .08em; }
.rank { font-family: var(--head); font-weight: 800; font-size: 32px; line-height: 1.1; }
.streak { text-align: center; font-size: 22px; line-height: 1; } .streak b { font-family: var(--head); font-size: 28px; } .streak small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.xpline { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: -4px; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; } .mini div { background: var(--surface2); border-radius: 12px; padding: 8px 10px; } .mini b { font-family: var(--head); font-size: 22px; display: block; line-height: 1.1; } .mini small { color: var(--muted); font-size: 12px; font-weight: 600; }
.path { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 22px 0 4px; }
.path .step { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 8px 14px 8px 8px; flex: 1 1 220px; }
.path .num { width: 34px; height: 34px; border-radius: 10px; background: var(--tc); color: var(--bg); display: grid; place-items: center; font-family: var(--head); font-weight: 800; flex: 0 0 auto; }
.path b { font-family: var(--head); display: block; line-height: 1.2; color: var(--tc); } .path small { color: var(--muted); font-size: 13px; line-height: 1.3; display: block; } .path .arrow { color: var(--muted); font-weight: 800; }
@media (max-width: 760px) { .path .arrow { display: none; } }
.sect { font-size: 22px; font-weight: 800; margin: 26px 0 12px; }
.cards { margin: 0 0 4px; }
.tiers3 { display: grid; gap: 5px; margin-top: 2px; } .t3 { display: grid; grid-template-columns: 34px 1fr 38px; align-items: center; gap: 8px; }
.t3l { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--tc); } .t3n { font-size: 12px; color: var(--muted); font-weight: 700; text-align: right; }
.bar.sm { height: 6px; } .bar .f-beginner { background: var(--beg); } .bar .f-intermediate { background: var(--mid); } .bar .f-pro { background: var(--prc); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.ach { background: var(--surface); border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; opacity: .55; filter: grayscale(1); }
.ach.on { opacity: 1; filter: none; border-style: solid; border-color: var(--mark); background: linear-gradient(180deg, var(--surface), var(--surface2)); }
.ach .ic { font-size: 26px; line-height: 1.1; } .ach b { font-family: var(--head); } .ach small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
/* lesson nav */
.ttabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.ttab { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 46px; padding: 6px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; border-bottom: 4px solid var(--tc); touch-action: manipulation; text-align: left; }
.ttab b { font-family: var(--head); font-size: 15px; } .ttab small { font-weight: 700; color: var(--muted); }
.ttab.on { background: var(--tc); border-color: var(--tc); color: var(--bg); } .ttab.on small { color: var(--bg); opacity: .85; }
@media (max-width: 520px) { .ttab { flex-direction: column; align-items: flex-start; gap: 0; } .ttab b { font-size: 13px; } }
.lchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 8px; scrollbar-width: thin; }
.lchip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; max-width: 220px; min-height: 44px; padding: 4px 14px 4px 6px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; touch-action: manipulation; text-align: left; }
.lchip .n { width: 32px; height: 32px; border-radius: 9px; background: var(--surface2); display: grid; place-items: center; font-family: var(--head); font-weight: 800; flex: 0 0 auto; }
.lchip .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lchip.done .n { background: var(--good-bg); color: var(--good); } .lchip.done { border-color: var(--good); }
.lchip.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; } .lchip.current .n { background: var(--accent); color: var(--accent-ink); }
.lchip:focus-visible, .ttab:focus-visible, .drow:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.lhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; } .lhead .concept { margin: 0; } .lhead .pill { margin-left: auto; }
.tier { font-family: var(--head); font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; background: var(--tc); color: var(--bg); padding: 3px 9px; border-radius: 99px; }
/* editor upgrades */
.edbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; } .fname { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 600; } .grow { flex: 1; }
.sym.sm { min-width: 38px; height: 32px; font-size: 13px; font-family: var(--head); font-weight: 800; }
.editor pre, .editor textarea { font-size: var(--code-size); line-height: var(--lh); padding: 12px 14px 12px 60px; }
.editor { background-size: 100% var(--lh); background-position: 0 12px; }

    quiz: { code: 'let n: number = 5;\nn = n * 2;\nconsole.log(n + "!");', options: ['10!', '5!', '10'], answer: 0, why: 'n becomes 10, and adding a string joins them into the text "10!".' } },
  { tier: 'beginner', id: 'functions', title: 'Typed functions', concept: 'parameters and return type',
    body: '<p>Annotate each parameter, and the return type after the parentheses: <code>function add(a: number, b: number): number</code>. TypeScript then checks every call: wrong argument types or the wrong number of arguments are errors, and so is returning the wrong kind of value.</p>',
    example: 'function add(a: number, b: number): number {\n  return a + b;\n}\nconsole.log(add(2, 3));',
    task: 'Write <code>area(w: number, h: number): number</code> that returns width times height.',
    starter: 'function area(w: number, h: number): number {\n  \n}\n',
    check: { tests: [['area(3, 4)', 12], ['area(0, 9)', 0], ['area(2.5, 2)', 5]] },
    hint: 'return w * h;',
    solution: 'function area(w: number, h: number): number {\n  return w * h;\n}',
    quiz: { code: 'function twice(n: number): number {\n  return n * 2;\n}\nconsole.log(twice(twice(3)));', options: ['6', '12', '9'], answer: 1, why: 'twice(3) is 6, and twice(6) is 12.' } },
  { tier: 'beginner', id: 'arrays', title: 'Typed arrays', concept: 'number[], Array<T>',
    body: '<p>An array type puts <code>[]</code> after the element type: <code>number[]</code> is a list of numbers, <code>string[]</code> a list of strings. (<code>Array&lt;number&gt;</code> means the same.) Pushing the wrong kind of value into it is an error.</p><p>A <b>tuple</b> fixes both the length and each position\'s type: <code>[string, number]</code>.</p>',
    example: 'const nums: number[] = [1, 2, 3];\nnums.push(4);\nconst pair: [string, number] = ["age", 36];\nconsole.log(nums.length, pair[0]);',
    task: 'Write <code>average(nums: number[]): number</code> that returns the average. An empty array gives <code>0</code>.',
    starter: 'function average(nums: number[]): number {\n  \n}\n',
    check: { tests: [['average([2, 4, 6])', 4], ['average([])', 0], ['average([1, 2])', 1.5]] },
    hint: 'if (nums.length === 0) return 0; then sum them (a loop or reduce) and divide by nums.length.',
    solution: 'function average(nums: number[]): number {\n  if (nums.length === 0) return 0;\n  const total = nums.reduce((a, b) => a + b, 0);\n  return total / nums.length;\n}',
    quiz: { code: 'const xs: number[] = [3, 1, 2];\nxs.push(9);\nconsole.log(xs.length, xs[3]);', options: ['4 9', '3 9', '4 2'], answer: 0, why: 'push adds 9 to the end, so there are 4 items and index 3 is the 9.' } },
  { tier: 'beginner', id: 'interfaces', title: 'Interfaces', concept: 'interface',
    body: '<p>An <b>interface</b> names the shape of an object: which properties it has and their types. Then you can use it as a type: <code>const p: Person = {...}</code>. TypeScript reports a missing property, an extra property, or a wrong type.</p><p>Add <code>?</code> to make a property optional: <code>nickname?: string</code>.</p>',
    example: 'interface Person {\n  name: string;\n  age: number;\n}\nconst p: Person = { name: "Ada", age: 36 };\nconsole.log(p.name, p.age);',
    task: 'Write <code>describe(p: Person): string</code> that returns text like <code>Ada (36)</code>.',
    starter: 'interface Person {\n  name: string;\n  age: number;\n}\n\nfunction describe(p: Person): string {\n  \n}\n',
    check: { tests: [['describe({ name: "Ada", age: 36 })', 'Ada (36)'], ['describe({ name: "Bo", age: 9 })', 'Bo (9)']] },
    hint: 'return `${p.name} (${p.age})`;',
    solution: 'interface Person {\n  name: string;\n  age: number;\n}\n\nfunction describe(p: Person): string {\n  return `${p.name} (${p.age})`;\n}',
    quiz: { code: 'interface P { x: number; y: number }\nconst a: P = { x: 1, y: 2 };\nconst b: P = { ...a, y: 5 };\nconsole.log(a.y, b.y);', options: ['2 5', '5 5', '2 2'], answer: 0, why: 'The spread copies a into a new object and then overrides y. a itself is unchanged.' } },
  { tier: 'beginner', id: 'unions', title: 'Union types', concept: 'string | number',
    body: '<p>A <b>union</b> type says "one of these": <code>string | number</code>. Before using a union value you must <b>narrow</b> it so TypeScript knows which one you have. <code>typeof value === "string"</code> inside an <code>if</code> narrows it to a string in that branch.</p>',
    example: 'function show(v: string | number): string {\n  if (typeof v === "string") {\n    return v.toUpperCase();\n  }\n  return v.toFixed(1);\n}\nconsole.log(show("hi"), show(2));',
    task: 'Write <code>format(value: string | number): string</code>. For a string return it in upper case; for a number return it with exactly 2 decimals (<code>toFixed(2)</code>).',
    starter: 'function format(value: string | number): string {\n  \n}\n',
    check: { tests: [['format("abc")', 'ABC'], ['format(3)', '3.00'], ['format(2.456)', '2.46']] },
    hint: 'if (typeof value === "string") { return value.toUpperCase(); } return value.toFixed(2);',
    solution: 'function format(value: string | number): string {\n  if (typeof value === "string") {\n    return value.toUpperCase();\n  }\n  return value.toFixed(2);\n}',
    quiz: { code: 'function f(v: string | number) {\n  return typeof v === "string" ? v.length : v * 2;\n}\nconsole.log(f("abc"), f(4));', options: ['3 8', '3 4', '"abc" 8'], answer: 0, why: 'For the string the result is its length (3). For the number it is doubled (8).' } },
  { tier: 'intermediate', id: 'optional', title: 'Optional and default parameters', concept: 'x?: T, x = default',
    body: '<p>A <code>?</code> after a parameter name makes it <b>optional</b>: callers may leave it out, and inside the function its type includes <code>undefined</code>. A default value does the same job and fills the gap for you: <code>greeting: string = "Hello"</code>.</p><p>Use <code>??</code> ("nullish coalescing") to pick a fallback only when a value is <code>null</code> or <code>undefined</code>.</p>',
    example: 'function greet(name: string, greeting: string = "Hello"): string {\n  return `${greeting}, ${name}!`;\n}\nconsole.log(greet("Ada"), greet("Bo", "Hi"));',
    task: 'Write <code>repeat(text: string, times?: number): string</code> that repeats the text. If <code>times</code> is missing, repeat it 2 times.',
    starter: 'function repeat(text: string, times?: number): string {\n  \n}\n',
    check: { tests: [['repeat("ab")', 'abab'], ['repeat("ab", 3)', 'ababab'], ['repeat("x", 0)', '']] },
    hint: 'return text.repeat(times ?? 2);',
    solution: 'function repeat(text: string, times?: number): string {\n  return text.repeat(times ?? 2);\n}',
    quiz: { code: 'function f(a: number, b: number = 10): number {\n  return a + b;\n}\nconsole.log(f(1), f(1, 2));', options: ['11 3', '1 3', '11 11'], answer: 0, why: 'f(1) uses the default b = 10, giving 11. f(1, 2) uses 2, giving 3.' } },
  { tier: 'intermediate', id: 'classes', title: 'Classes', concept: 'class, constructor, public',
    body: '<p>TypeScript classes declare their members with types and access modifiers (<code>public</code>, <code>private</code>, <code>readonly</code>). The shortcut <code>constructor(public w: number)</code> declares <b>and</b> assigns a property in one go.</p>',
    example: 'class Dog {\n  constructor(public name: string) {}\n  speak(): string {\n    return `${this.name} says woof`;\n  }\n}\nconsole.log(new Dog("Rex").speak());',
    task: 'Finish the <code>Rectangle</code> class: <code>area()</code> returns width times height and <code>perimeter()</code> returns <code>2 * (width + height)</code>.',
    starter: 'class Rectangle {\n  constructor(public width: number, public height: number) {}\n\n  area(): number {\n    // return width * height\n    return 0;\n  }\n\n  perimeter(): number {\n    // return 2 * (width + height)\n    return 0;\n  }\n}\n',
    check: { tests: [['r.area()', 12, 'const r = new Rectangle(3, 4);'], ['r.perimeter()', 14, 'const r = new Rectangle(3, 4);'], ['r.area()', 0, 'const r = new Rectangle(0, 9);']] },
    hint: 'Use this.width and this.height.',
    solution: 'class Rectangle {\n  constructor(public width: number, public height: number) {}\n\n  area(): number {\n    return this.width * this.height;\n  }\n\n  perimeter(): number {\n    return 2 * (this.width + this.height);\n  }\n}',
    quiz: { code: 'class Counter {\n  private n: number = 0;\n  inc(): this { this.n++; return this; }\n  get value(): number { return this.n; }\n}\nconsole.log(new Counter().inc().inc().value);', options: ['1', '2', '0'], answer: 1, why: 'Each inc() adds 1 and returns the same object, so two calls give 2.' } },
  { tier: 'intermediate', id: 'generics', title: 'Generics', concept: 'function f<T>(x: T)',
    body: '<p>A <b>generic</b> is a type placeholder, written <code>&lt;T&gt;</code>. It lets one function work for many types while keeping them connected: <code>first&lt;T&gt;(arr: T[]): T | undefined</code> returns a number for a number array and a string for a string array, and TypeScript knows which.</p>',
    example: 'function identity<T>(x: T): T {\n  return x;\n}\nconsole.log(identity<number>(5), identity("hi"));',
    task: 'Write <code>first&lt;T&gt;(arr: T[]): T | undefined</code> that returns the first item, or <code>undefined</code> for an empty array.',
    starter: 'function first<T>(arr: T[]): T | undefined {\n  \n}\n',
    check: { tests: [['first([5, 6, 7])', 5], ['first(["a", "b"])', 'a'], ['first([]) === undefined', true]] },
    hint: 'return arr[0];  (an empty array gives undefined already)',
    solution: 'function first<T>(arr: T[]): T | undefined {\n  return arr[0];\n}',
    quiz: { code: 'function pair<A, B>(a: A, b: B): [A, B] {\n  return [a, b];\n}\nconst p = pair("x", 1);\nconsole.log(p[0], p[1]);', options: ['x 1', '1 x', 'x,1'], answer: 0, why: 'The tuple keeps each value in its own position: first the string, then the number.' } },
  { tier: 'intermediate', id: 'enums', title: 'Enums', concept: 'enum',
    body: '<p>An <b>enum</b> gives names to a fixed set of values: <code>enum Direction { North, East, South, West }</code>. Behind the scenes the names count up from 0, so <code>Direction.East</code> is 1, and you can look the name up again with <code>Direction[1]</code>.</p>',
    example: 'enum Color { Red, Green, Blue }\nconsole.log(Color.Green, Color[2]);',
    task: 'Write <code>turnRight(d: Direction): Direction</code>. North becomes East, East becomes South, South becomes West, and West becomes North.',
    starter: 'enum Direction { North, East, South, West }\n\nfunction turnRight(d: Direction): Direction {\n  \n}\n',
    check: { tests: [['turnRight(Direction.North)', 1], ['turnRight(Direction.West)', 0], ['Direction[turnRight(Direction.East)]', 'South']] },
    hint: 'return (d + 1) % 4;',
    solution: 'enum Direction { North, East, South, West }\n\nfunction turnRight(d: Direction): Direction {\n  return (d + 1) % 4;\n}',
    quiz: { code: 'enum Level { Low = 1, Mid = 5, High }\nconsole.log(Level.Low, Level.High, Level[5]);', options: ['1 6 Mid', '0 2 Mid', '1 5 High'], answer: 0, why: 'Low is 1, Mid is 5, and High continues counting from Mid to 6. Level[5] looks the name back up: "Mid".' } },
  { tier: 'intermediate', id: 'inherit', title: 'Abstract classes and interfaces', concept: 'abstract, implements',
    body: '<p>An <b>abstract class</b> is a base that cannot be created directly and forces subclasses to supply certain methods. An <b>interface</b> can also be <code>implements</code>-ed by a class as a contract. Both let you write code against a general type (<code>Shape</code>) and use many concrete ones.</p>',
    example: 'abstract class Shape {\n  abstract area(): number;\n  describe(): string {\n    return `area ${this.area()}`;\n  }\n}\nclass Square extends Shape {\n  constructor(private s: number) { super(); }\n  area(): number { return this.s * this.s; }\n}\nconsole.log(new Square(3).describe());',
    task: 'Finish <code>Circle</code>: its <code>area()</code> returns <code>Math.PI * r * r</code>. (The <code>describe()</code> in the base class will use it.)',
    starter: 'abstract class Shape {\n  abstract area(): number;\n  describe(): string {\n    return `area ${this.area().toFixed(2)}`;\n  }\n}\n\nclass Circle extends Shape {\n  constructor(private r: number) { super(); }\n  area(): number {\n    // return Math.PI * r * r\n    return 0;\n  }\n}\n',
    check: { tests: [['new Circle(1).describe()', 'area 3.14'], ['new Circle(2).describe()', 'area 12.57'], ['new Circle(0).area()', 0]] },
    hint: 'return Math.PI * this.r * this.r;',
    solution: 'abstract class Shape {\n  abstract area(): number;\n  describe(): string {\n    return `area ${this.area().toFixed(2)}`;\n  }\n}\n\nclass Circle extends Shape {\n  constructor(private r: number) { super(); }\n  area(): number {\n    return Math.PI * this.r * this.r;\n  }\n}',
    quiz: { code: 'interface Named { name: string }\nclass User implements Named {\n  constructor(public name: string) {}\n}\nconst n: Named = new User("Ada");\nconsole.log(n.name);', options: ['Ada', 'Named', 'undefined'], answer: 0, why: 'User satisfies the Named contract, so it can be stored in a Named variable. Its name is still "Ada".' } },
  { tier: 'pro', id: 'guards', title: 'Discriminated unions', concept: 'type unions + narrowing',
    body: '<p>Give every variant of a union a literal <b>tag</b> property, such as <code>kind: "circle"</code>. Checking the tag (with <code>switch</code> or <code>if</code>) <b>narrows</b> the type, so inside each branch TypeScript knows exactly which fields exist. This pattern models real data very safely.</p>',
    example: 'type Shape =\n  | { kind: "circle"; r: number }\n  | { kind: "square"; s: number };\n\nfunction area(sh: Shape): number {\n  switch (sh.kind) {\n    case "circle": return Math.PI * sh.r ** 2;\n    case "square": return sh.s * sh.s;\n  }\n}\nconsole.log(area({ kind: "square", s: 3 }));',
    task: 'Write <code>area(sh: Shape): number</code> for a rectangle (<code>w</code> and <code>h</code>) and a triangle (<code>base</code> and <code>height</code>, area is half of base times height).',
    starter: 'type Shape =\n  | { kind: "rect"; w: number; h: number }\n  | { kind: "tri"; base: number; height: number };\n\nfunction area(sh: Shape): number {\n  \n}\n',
    check: { tests: [['area({ kind: "rect", w: 3, h: 4 })', 12], ['area({ kind: "tri", base: 6, height: 5 })', 15], ['area({ kind: "rect", w: 0, h: 9 })', 0]] },
    hint: 'switch (sh.kind) { case "rect": return sh.w * sh.h; case "tri": return (sh.base * sh.height) / 2; }',
    solution: 'type Shape =\n  | { kind: "rect"; w: number; h: number }\n  | { kind: "tri"; base: number; height: number };\n\nfunction area(sh: Shape): number {\n  switch (sh.kind) {\n    case "rect":\n      return sh.w * sh.h;\n    case "tri":\n      return (sh.base * sh.height) / 2;\n  }\n}',
    quiz: { code: 'type R = { ok: true; value: number } | { ok: false; error: string };\nconst r: R = { ok: false, error: "bad" };\nconsole.log(r.ok ? r.value : r.error);', options: ['bad', 'false', 'undefined'], answer: 0, why: 'ok is false, so the else branch runs and reads the error field.' } },
  { tier: 'pro', id: 'utility', title: 'Utility types', concept: 'Partial, Record, Pick',
    body: '<p>TypeScript ships helper types that build new types from old ones. <code>Partial&lt;T&gt;</code> makes every property optional, <code>Pick&lt;T, "a" | "b"&gt;</code> keeps only some, <code>Omit</code> removes some, and <code>Record&lt;K, V&gt;</code> describes an object with keys of type K and values of type V.</p><p>A typical use: update a record from a <code>Partial</code> of changes with spread.</p>',
    example: 'interface User { name: string; age: number }\nconst u: User = { name: "Ada", age: 36 };\nconst changes: Partial<User> = { age: 37 };\nconsole.log({ ...u, ...changes });\nconst scores: Record<string, number> = { a: 1, b: 2 };\nconsole.log(Object.keys(scores));',
    task: 'Write <code>update(user: User, changes: Partial&lt;User&gt;): User</code> that returns a <b>new</b> object with the changes applied.',
    starter: 'interface User {\n  name: string;\n  age: number;\n}\n\nfunction update(user: User, changes: Partial<User>): User {\n  \n}\n',
    check: { tests: [['update({ name: "Ada", age: 36 }, { age: 37 })', { name: 'Ada', age: 37 }], ['update({ name: "Ada", age: 36 }, {})', { name: 'Ada', age: 36 }], ['u.age', 36, 'const u = { name: "Ada", age: 36 }; update(u, { age: 99 });']] },
    hint: 'return { ...user, ...changes };',
    solution: 'interface User {\n  name: string;\n  age: number;\n}\n\nfunction update(user: User, changes: Partial<User>): User {\n  return { ...user, ...changes };\n}',
    quiz: { code: 'const prices: Record<string, number> = { pen: 2, book: 10 };\nprices["cup"] = 5;\nconsole.log(Object.keys(prices).length, prices.book);', options: ['3 10', '2 10', '3 5'], answer: 0, why: 'Adding "cup" makes three entries, and prices.book is still 10.' } },
  { tier: 'pro', id: 'generic-map', title: 'Generic algorithms', concept: 'function types + generics',
    body: '<p>Function types describe callbacks: <code>(x: T) =&gt; U</code> is a function taking a T and returning a U. Combined with generics, you can write your own <code>map</code>, <code>filter</code> and <code>reduce</code> that are fully type-safe: the output type is worked out from what you pass in.</p>',
    example: 'function apply<T, U>(x: T, f: (v: T) => U): U {\n  return f(x);\n}\nconsole.log(apply(4, (n) => n * n), apply("hi", (s) => s.length));',
    task: 'Write <code>mapArray&lt;T, U&gt;(arr: T[], fn: (x: T) =&gt; U): U[]</code> using a loop (do not use the built-in <code>map</code>).',
    starter: 'function mapArray<T, U>(arr: T[], fn: (x: T) => U): U[] {\n  const out: U[] = [];\n  // call fn on every item and push the result\n  return out;\n}\n',
    check: { tests: [['mapArray([1, 2, 3], (n) => n * 10)', [10, 20, 30]], ['mapArray(["a", "bb"], (s) => s.length)', [1, 2]], ['mapArray([], (n) => n)', []]] },
    hint: 'for (const item of arr) { out.push(fn(item)); }',
    solution: 'function mapArray<T, U>(arr: T[], fn: (x: T) => U): U[] {\n  const out: U[] = [];\n  for (const item of arr) {\n    out.push(fn(item));\n  }\n  return out;\n}',
    quiz: { code: 'const double = (n: number): number => n * 2;\nconsole.log([1, 2, 3].map(double));', options: ['[2, 4, 6]', '[1, 2, 3]', '12'], answer: 0, why: 'map calls double on each item and collects the results.' } },
  { tier: 'bug', id: 'bug-types', title: 'Bug: the type error', concept: 'read the compiler message',
    body: '<p>TypeScript\'s biggest gift is that it tells you about mistakes <b>before</b> running. When you run this code you will see an error like <code>TS2345: Argument of type \'string\' is not assignable to parameter of type \'number\'</code>. Read it slowly: it names the line, what you passed, and what was expected.</p>',
    example: 'function double(n: number): number {\n  return n * 2;\n}\nconsole.log(double(21));',
    task: 'Run the code. The compiler refuses it. Fix the bug so it prints <code>42</code>.',
    starter: 'function double(n: number): number {\n  return n * 2;\n}\n\nconst result: number = double("21");\nconsole.log(result);\n',
    check: { out: '42' },
    hint: 'double expects a number, but "21" is a string. Remove the quotes.',
    solution: 'function double(n: number): number {\n  return n * 2;\n}\n\nconst result: number = double(21);\nconsole.log(result);',
    quiz: { code: 'const a: number = 5;\nconst b: number = 10;\nconsole.log(a + b, `${a}${b}`);', options: ['15 510', '15 15', '510 510'], answer: 0, why: 'Numbers add (15), but putting them side by side inside a template string joins the digits (510).' } },
  { tier: 'bug', id: 'bug-undefined', title: 'Bug: reading undefined', concept: '?. and ??',
    body: '<p>A very common runtime bug: reading a property of something that is <code>undefined</code> throws <code>TypeError: Cannot read properties of undefined</code>. Optional properties (<code>address?: ...</code>) can be missing, so you must guard them.</p><p>Use <b>optional chaining</b> <code>a?.b</code> (stops and gives undefined if a is missing) and <code>??</code> to supply a fallback.</p>',
    example: 'const user: { name: string; address?: { city: string } } = { name: "Ada" };\nconsole.log(user.address?.city ?? "unknown");',
    task: '<code>getCity</code> crashes when a user has no address. Fix it so it returns <code>"unknown"</code> in that case.',
    starter: 'interface User {\n  name: string;\n  address?: { city: string };\n}\n\nfunction getCity(user: User): string {\n  return user.address.city;\n}\n',
    check: { tests: [['getCity({ name: "Ada" })', 'unknown'], ['getCity({ name: "Bo", address: { city: "Oslo" } })', 'Oslo']] },
    hint: 'return user.address?.city ?? "unknown";',
    solution: 'interface User {\n  name: string;\n  address?: { city: string };\n}\n\nfunction getCity(user: User): string {\n  return user.address?.city ?? "unknown";\n}',
    quiz: { code: 'const o: { a?: { b: number } } = {};\nconsole.log(o.a?.b, o.a?.b ?? 0);', options: ['undefined 0', '0 0', 'undefined undefined'], answer: 0, why: 'o.a is missing, so o.a?.b is undefined. The ?? supplies 0 only in the second expression.' } },
];

  { tier: 'intermediate', id: 'exceptions', title: 'Exceptions', concept: 'try, catch, finally, throw',

    body: '<p>To find a value in a <b>sorted</b> list you do not need to check every item. <b>Binary search</b> looks at the middle: if the target is smaller, discard the right half; if larger, discard the left half. Repeat until found or nothing is left.</p><p>Each step halves the work, so a million items need only about 20 checks. That is <b>O(log n)</b> compared with O(n) for a plain loop.</p>',

  { tier: 'pro', id: 'search', title: 'Binary search', concept: 'O(log n)',

using namespace std;

int find_index(vector<int> v, int target) {
    int lo = 0, hi = v.size() - 1;
    while (lo <= hi) {
        int mid = (lo + hi) / 2;
        if (v[mid] == target) {
            return mid;
        } else if (v[mid] < target) {

        } else {

    '<div class="syms" role="group" aria-label="Quick keys"><button type="button" class="sym" data-ins="    " aria-label="Insert tab">Tab</button>' + SYMS[lang].map((s) => '<button type="button" class="sym" data-ins="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>';

    code.innerHTML = hl(ta.value, lang) + '\n';

    const lh = parseFloat(getComputedStyle(ta).lineHeight) || 22; ed.style.height = Math.max(190, Math.min(480, lines * lh + 30)) + 'px';
  };

    ta.focus(); let ok = false; try { ok = document.execCommand('insertText', false, text); } catch (e) {}
    if (!ok) { const s = ta.selectionStart; ta.setRangeText(text, s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  };

  ta.addEventListener('input', () => { paint(); sync(); onChange && onChange(ta.value); });
  ta.addEventListener('scroll', sync);
  const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" }; if (lang === 'js') PAIRS['`'] = '`';
  ta.addEventListener('keydown', (e) => {
    if (!e.ctrlKey && !e.metaKey && !e.altKey && ta.selectionStart === ta.selectionEnd && e.key.length === 1 || e.key === 'Backspace') {
      const s = ta.selectionStart, v = ta.value, k = e.key, nextCh = v[s], prevCh = v[s - 1];
      if (ta.selectionStart === ta.selectionEnd && !e.ctrlKey && !e.metaKey && !e.altKey) {

        if (k.length === 1 && ')]}"\'`'.includes(k) && nextCh === k) { e.preventDefault(); ta.setSelectionRange(s + 1, s + 1); return; }
        if (k.length === 1 && PAIRS[k] && !(isQuote && (/\w/.test(prevCh || '') || (nextCh && /\w/.test(nextCh))))) { e.preventDefault(); insert(k + PAIRS[k]); const p = ta.selectionStart - 1; ta.setSelectionRange(p, p); return; }
        if (k === 'Backspace' && prevCh && PAIRS[prevCh] === nextCh) { e.preventDefault(); ta.setSelectionRange(s - 1, s + 1); let ok = false; try { ok = document.execCommand('delete'); } catch (x) {} if (!ok) { ta.setRangeText('', s - 1, s + 1, 'end'); ta.dispatchEvent(new Event('input')); } return; }
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insert('    '); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
      const s = ta.selectionStart, v = ta.value; const ls = v.lastIndexOf('\n', s - 1) + 1; const line = v.slice(ls, s);
      const ind = /^[ \t]*/.exec(line)[0]; const t = line.trimEnd(); const next = v[ta.selectionEnd];

}

function renderWeb() {
  let i = WEB.findIndex((l) => l.id === view.id); if (i < 0) i = Math.max(0, WEB.findIndex((l) => !S.web[l.id]));
  const les = WEB[i], key = 'web:' + les.id, code = S.code[key] !== undefined ? S.code[key] : les.starter;
  app.innerHTML = '<div class="wrap">' + topbar('<button class="btn small" id="back">← Home</button><div class="crumb">🌐 HTML & CSS Lab</div>') +
    '<p class="pill">Everything runs in your browser. The preview updates as you type. ' + Object.keys(S.web).length + '/' + WEB.length + ' done, +10 XP each.</p>' +
    '<div class="chips">' + WEB.map((l, j) => '<button class="chip' + (S.web[l.id] ? ' done' : '') + (j === i ? ' current' : '') + '" data-w="' + l.id + '">' + (S.web[l.id] ? '✓' : j + 1) + '</button>').join('') + '</div>' +
    '<div class="grid"><section class="card learn"><span class="concept">HTML / CSS</span><h2>' + les.title + '</h2><div class="body">' + les.body + '</div><p><b>Your turn:</b> ' + les.task + '</p></section>' +
    '<section class="card work"><textarea id="wcode" spellcheck="false" autocapitalize="off" autocomplete="off" style="width:100%;min-height:200px;font-family:var(--mono);font-size:14px;line-height:1.5;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--code-bg);color:var(--text);tab-size:2"></textarea>' +
    '<div class="btns" style="margin:10px 0"><button class="btn primary" id="wcheck">✓ Check</button><button class="btn" id="whint">Hint</button><button class="btn" id="wreset">Reset</button>' + (i + 1 < WEB.length ? '<button class="btn" id="wnext">Next →</button>' : '') + '</div><div id="wverdict" aria-live="polite"></div>' +
    '<h3 style="margin:10px 0 6px">Preview</h3><iframe id="wprev" title="Preview" sandbox="allow-same-origin" style="width:100%;height:240px;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe></section></div></div>';
  bindTheme();
  const ta = $('#wcode'), fr = $('#wprev'); ta.value = code;
  const show = (cb) => { fr.onload = () => { if (cb) cb(fr.contentDocument); }; fr.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;padding:10px;margin:0}</style></head><body>' + ta.value + '</body></html>'; };
  let tm; ta.addEventListener('input', () => { S.code[key] = ta.value; save(); clearTimeout(tm); tm = setTimeout(() => show(), 200); }); show();
  $('#back').addEventListener('click', () => go({ name: 'home' }));
  $$('[data-w]').forEach((b) => b.addEventListener('click', () => go({ name: 'web', id: b.dataset.w })));
  const nx = $('#wnext'); if (nx) nx.addEventListener('click', () => go({ name: 'web', id: WEB[i + 1].id }));
  $('#wreset').addEventListener('click', () => { ta.value = les.starter; S.code[key] = ta.value; save(); show(); $('#wverdict').innerHTML = ''; });
  $('#whint').addEventListener('click', () => { $('#wverdict').innerHTML = '<div class="reveal"><b>Hint:</b> ' + esc(les.hint) + '<div style="margin-top:8px"><button class="btn small" id="wsol">Show solution</button></div></div>'; $('#wsol').addEventListener('click', () => { ta.value = les.solution; S.code[key] = ta.value; save(); show(); }); });
  $('#wcheck').addEventListener('click', () => show((d) => {
    const r = les.test(d), v = $('#wverdict');
    if (r === true) {
      const first = !S.web[les.id]; if (first) { S.web[les.id] = true; save(); confetti(); toast('⭐ +10 XP · ' + rankInfo().rank.name); }
      v.innerHTML = '<div class="verdict ok" role="status"><strong>✓ Nice work, that passes!</strong>' + (first ? '+10 XP. ' : 'Already completed. ') + (i + 1 < WEB.length ? 'Tap Next when you are ready.' : 'You finished the lab! 🎉') + '</div>';
      $$('.chip.current').forEach((c) => { c.classList.add('done'); c.textContent = '✓'; });
    } else v.innerHTML = '<div class="verdict no" role="status"><strong>Not quite yet</strong>' + esc(r) + '</div>';
  }));
}

      const now = Date.now();
      if (rm.b !== R.seen.b) R.seen = { b: rm.b, at: now };
      if (now - R.seen.at > 12000) return fail('The host is not there anymore.');
      const me2 = rm.g && rm.g[me.uid];

      duelRoomSet(R, members);
    } catch (e) { /* retry */ }

}

    duelScoreHtml(D) +
    '<section class="card quizcard"><div class="bar"><div id="dtbar" style="width:100%;transition:none"></div></div><div class="xpline" style="margin-top:6px"><span id="dtime">' + D.T.toFixed(1) + 's</span><span>faster = more points</span></div>' +
    '<div class="quiz" style="margin-top:8px"><h3>' + LANGS[e.k].name + ': what does this print?</h3><pre class="codeblock">' + hl(qp.display, e.k) + '</pre><div class="opts">' + e.opts.map((o, j) => '<button class="opt" data-o="' + j + '">' + esc(o) + '</button>').join('') + '</div><div class="why" id="dwhy" aria-live="polite"></div></div></section>');
  bindTheme();
  $('#ff').addEventListener('click', () => { if (confirm('Forfeit this match?' + (D.ranked ? ' It counts as a loss.' : ''))) { if (D.online) duelFinishOnline('ff'); else duelFinish(true); } });
  $$('.opt').forEach((b) => b.addEventListener('click', () => duelAnswer(+b.dataset.o)));
  D.answered = false; D.t0 = performance.now();
  if (D.online) duelOnlineUi(D);
  D.tick = setInterval(() => {
    const left = Math.max(0, D.T - (performance.now() - D.t0) / 1000), bar = $('#dtbar'), tm = $('#dtime');
    if (bar) { bar.style.width = (left / D.T * 100) + '%'; bar.style.background = left < 5 ? 'var(--bad)' : ''; }
    if (tm) tm.textContent = left.toFixed(1) + 's';
    if (left <= 0) duelAnswer(-1);
  }, 100);
  if (!D.online) D.bt = setTimeout(() => { const s = $('#dbot'); if (s && !D.answered) s.textContent = 'answered ✓'; }, e.bot.t * 1000);
}
function duelAnswer(c) {
  const D = DU; if (!D || !D.active || D.answered || D.stage !== 'play') return; D.answered = true; duelStop();
  const e = D.qs[D.i], t = Math.min(D.T, (performance.now() - D.t0) / 1000), ok = c === e.ans;
  const pm = ok ? duelPts(t, D.T) : 0;
  D.me += pm; D.res.push({ ok, pm });
  $$('.opt').forEach((b, j) => { b.disabled = true; if (j === e.ans) b.classList.add('right'); else if (j === c) b.classList.add('wrong'); });
  if (D.online) { duelPutAnswer(D, D.i, c, t); duelOnlineUi(D); }
  else {
    const pb = e.bot.ok ? duelPts(e.bot.t, D.T) : 0; D.bot += pb; D.res[D.res.length - 1].bok = e.bot.ok;
    $('#dme').textContent = D.me; $('#dbotp').textContent = D.bot; $('#dbot').textContent = e.bot.ok ? '✓ ' + e.bot.t.toFixed(1) + 's · +' + pb : '✗ +0';
  }
  const last = D.i + 1 === D.NQ;
  $('#dwhy').innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'no') + '" role="status"><strong>' + (ok ? '✓ Correct · ' + t.toFixed(1) + 's · +' + pm : c < 0 ? '⏱ Time is up · +0' : '✗ Not quite · +0') + '</strong>' + esc(e.q.why) + '</div><div class="btns" style="margin-top:10px"><button class="btn primary" id="dnext">' + (last ? 'See result' : 'Next →') + '</button></div>';
  $('#dnext').addEventListener('click', () => {
    if (!last) { D.i++; renderDuel(); return; }
    if (!D.online) return duelFinish(false);
    const o = D.online; if (o.oth.every((u) => o.st[u].done || o.st[u].gone)) return duelFinishOnline('done');
    D.stage = 'wait'; renderDuel();
  });
}
function duelResultView() {
  const D = DU, o = D.over, up = o.ta.i > o.tb.i, down = o.ta.i < o.tb.i, bot = D.mode === 'bot', team = !bot && D.n > 1;
  const title = o.res === 'win' ? (o.oppLeft ? '🏆 The other side left' : '🏆 Victory!') : o.res === 'loss' ? (o.forfeit ? '🏳️ Forfeited' : '💔 Defeat') : '🤝 Draw';
  const L = bot ? D.me : D.mine, Rt = bot ? D.bot : D.theirs;
  const dots = (k) => D.res.map((r) => '<i class="' + (r[k] ? 'ok' : '') + '">' + (r[k] ? '✓' : '✗') + '</i>').join('');
  const note = bot ? 'Practice match · no rank points' : D.kind === 'room' ? 'Friendly match · no rank points' : 'Unranked match · no rank points';
  const again = D.kind === 'room' ? (D.roomCode ? '<button class="btn primary" id="rback">↩ Return to room</button> ' : '') : '<button class="btn primary" id="again">▶ Play again</button> ';
  const board = team && D.board ? '<div class="lobby" style="margin:12px 0">' + [true, false].map((mn) => '<div class="lobcol"><b>' + (mn ? 'Your team' : 'Enemy team') + '</b>' + D.board.filter((x) => x.mine === mn).map((x) => '<div class="lobp"' + (x.me ? ' style="font-weight:800"' : '') + '>' + esc(x.n) + ' · ' + x.pts + '</div>').join('') + '</div>').join('') + '</div>' : '';
  app.innerHTML = duelWrap('<button class="btn small" id="back">← Home</button><div class="crumb">⚔️ Duel result · ' + duelModeName(D.n) + '</div>', '',
    '<div class="card" style="text-align:center"><h2 style="font-size:32px">' + title + '</h2>' +
    '<div class="duelscore" style="margin:14px 0"><div><small>' + (team ? 'Your team' : 'You') + '</small><b>' + L + '</b></div><div><small>vs</small></div><div><small>' + (team ? 'Enemy team' : (bot ? '🤖' : '👤') + ' ' + esc(D.name)) + '</small><b>' + Rt + '</b></div></div>' + board +
    '<div class="dots" aria-label="Your answers">' + dots('ok') + '</div>' + (D.n === 1 ? '<div class="dots" aria-label="Opponent answers" style="margin-bottom:14px">' + dots('bok') + '</div>' : '<div style="height:14px"></div>') +
    (o.unranked ? '<p class="pill" style="margin:0">' + note + '</p>' :
      '<p style="font-family:var(--head);font-size:24px;font-weight:800;margin:0;color:var(--' + (o.delta >= 0 ? 'good' : 'bad') + ')">' + (o.delta >= 0 ? '+' : '') + o.delta + ' rank points</p>' +
      '<p class="pill" style="margin:4px 0 0">' + duelModeName(D.n) + ' · ' + o.before + ' → ' + o.after + ' · ' + o.ta.t.ic + ' ' + o.ta.t.n + '</p>' +
      (up ? '<p style="margin:10px 0 0"><b>⬆️ Promoted to ' + o.ta.t.n + '!</b></p>' : down ? '<p style="margin:10px 0 0"><b>⬇️ Dropped to ' + o.ta.t.n + '</b></p>' : '')) +
    '<div class="btns" style="margin-top:16px">' + again + '<button class="btn" id="menu">Duel menu</button></div></div>');
  bindTheme(); const lang = D.lang, kind = D.kind, n = D.n;
  $('#back').addEventListener('click', () => { DU = null; go({ name: 'home' }); });
  $('#menu').addEventListener('click', () => { DU = null; renderDuel(); });
  const rb = $('#rback');
  if (rb) rb.addEventListener('click', () => { const tm = {}; Object.keys(D.online.pl).forEach((u) => { tm[u] = D.online.pl[u].t; }); const info = { code: D.roomCode, cfg: D.rcfg, host: D.isHost, n: D.n, tm }; DU = null; if (info.host) duelRoomCreate(info.n, 'custom', null, { code: info.code, cfg: info.cfg, tm: info.tm }); else duelRoomJoin(info.code, { wait: true }); });
  const ag = $('#again'); if (ag) ag.addEventListener('click', () => { DU = null; if (kind === 'rq' || kind === 'uq') duelQueueStart(n, kind === 'rq', lang); else duelStart(lang); });
  if (o.res === 'win') confetti();
}
app.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-acc],[data-dec],[data-rem],[data-inv],[data-ijoin],[data-idec],[data-swap],[data-cf]');
  if (!b || view.name !== 'duel') return;
  const D = b.dataset, run = (p) => p.catch(() => toast('Could not reach the online service'));
  if (D.acc) run(duelFriendAccept(D.acc)); else if (D.dec) run(duelFriendDecline(D.dec)); else if (D.rem) run(duelFriendRemove(D.rem));
  else if (D.inv) run(duelInvite(D.inv)); else if (D.ijoin) run(duelInviteJoin(D.ijoin)); else if (D.idec) run(duelInviteDismiss(D.idec));
  else if (D.cf) { const i = D.cf.indexOf(':'); duelRoomCfg(D.cf.slice(0, i), D.cf.slice(i + 1)); }
  else if (D.swap && DUQ && DUQ.room && DUQ.host) { DUQ.tm[D.swap] = DUQ.tm[D.swap] === 'A' ? 'B' : 'A'; duelRoomSet(DUQ, (DUQ.members || []).map((x) => Object.assign({}, x, { t: DUQ.tm[x.u] }))); dbPut('rooms/' + DUQ.code + '/tm', DUQ.tm).catch(() => {}); }
});
document.addEventListener('keydown', (ev) => {
  if (!DU || !DU.active || DU.answered || DU.stage !== 'play' || view.name !== 'duel' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  const n = +ev.key; if (n >= 1 && n <= DU.qs[DU.i].opts.length) duelAnswer(n - 1);
});

/* stats */
function bestStreak() {
  const ds = Array.from(new Set(S.days)).sort(); let best = 0, run = 0, prev = null;
  ds.forEach((d) => { const t = Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)); run = prev !== null && t - prev === 86400000 ? run + 1 : 1; prev = t; if (run > best) best = run; });
  return best;
}
function renderStats() {
  const r = rankInfo(), set = new Set(S.days), cells = [];
  for (let n = 13; n >= 0; n--) { const d = new Date(); d.setDate(d.getDate() - n); const on = set.has(dayStr(d)); cells.push('<span title="' + dayStr(d) + '" style="width:20px;height:20px;border-radius:5px;display:inline-block;background:' + (on ? 'var(--good)' : 'var(--border)') + '"></span>'); }
  const stat = (a, b) => '<div class="card shopitem"><p style="flex:0">' + b + '</p><h3 style="font-size:26px">' + a + '</h3></div>';
  const full = LANG_ORDER.filter((k) => countDone(k) === lessonsOf(k).length);
  app.innerHTML = '<div class="wrap">' + topbar('<button class="btn small" id="back">← Home</button><div class="crumb">📊 Your stats</div>') +
    '<div class="shopgrid">' + stat(r.rank.name, 'Rank') + stat(r.x, 'XP earned') + stat(wallet(), 'XP to spend') + stat('🔥 ' + streak(), 'Current streak (days)') + stat(bestStreak(), 'Best streak (days)') + stat(new Set(S.days).size, 'Days active') +
    stat(doneTotal() + ' / ' + TOTAL, 'Lessons done') + stat(Object.keys(S.quiz).length, 'Quiz answers right') + stat(Object.keys(S.web).length + ' / ' + WEB.length, 'Web lab lessons') + stat(Object.keys(S.badges).length + ' / ' + BADGES.length, 'Badges') + '</div>' +
    '<h2 class="sect" style="margin-top:22px">Last 14 days</h2><div class="row" style="gap:4px">' + cells.join('') + '</div>' +
    '<h2 class="sect" style="margin-top:22px">By language</h2><div class="card">' + LANG_ORDER.map((k) => { const d = countDone(k), n = lessonsOf(k).length; return '<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>' + LANGS[k].name + '</b><span class="pill">' + d + ' / ' + n + '</span></div><div class="bar"><div style="width:' + Math.round(d / n * 100) + '%"></div></div></div>'; }).join('') + '</div>' +
    '<h2 class="sect" style="margin-top:22px">Completion cards</h2><div class="row">' + (full.length ? full.map((k) => '<button class="btn primary" data-card="' + k + '">🎓 ' + LANGS[k].name + ' card</button>').join('') : '<span class="pill">Finish every lesson in a language to unlock its shareable card.</span>') + '</div></div>';
  bindTheme(); $('#back').addEventListener('click', () => go({ name: 'home' }));
  $$('[data-card]').forEach((b) => b.addEventListener('click', () => makeCard(b.dataset.card)));
}
function makeCard(lang) {
  const L = LANGS[lang], r = rankInfo(), cv = document.createElement('canvas'); cv.width = 1200; cv.height = 630; const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 1200, 630); g.addColorStop(0, '#05060f'); g.addColorStop(1, '#10204f'); c.fillStyle = g; c.fillRect(0, 0, 1200, 630);
  c.fillStyle = L.color; c.fillRect(0, 0, 1200, 14);
  const img = new Image(); img.onload = () => {
    c.drawImage(img, 70, 120, 390, 390); c.fillStyle = '#ffffff'; c.textBaseline = 'alphabetic';
    c.font = '700 40px system-ui, sans-serif'; c.fillStyle = '#9fb4ff'; c.fillText('LEARN TO CODE', 500, 180);
    c.font = '800 78px system-ui, sans-serif'; c.fillStyle = '#ffffff'; c.fillText('I completed', 500, 280); c.fillStyle = '#7dd3fc'; c.fillText(L.name + '!', 500, 370);
    c.font = '600 36px system-ui, sans-serif'; c.fillStyle = '#e8ecf9'; c.fillText(lessonsOf(lang).length + ' lessons · ' + r.x + ' XP · ' + r.rank.name, 500, 450);
    c.font = '600 30px system-ui, sans-serif'; c.fillStyle = '#9fb4ff'; c.fillText(location.host + location.pathname.replace(/index\.html$/, ''), 500, 540);
    cv.toBlob((blob) => {
      if (!blob) return; const file = new File([blob], 'learn-to-code-' + lang + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'I completed ' + L.name + '!' }).catch(() => {});
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); toast('🎓 Card saved to your downloads'); }
    }, 'image/png');
  };
  img.src = 'icon-512.png';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
view = fromHash();
render();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
window.__app = { go, S: () => S };
})();
